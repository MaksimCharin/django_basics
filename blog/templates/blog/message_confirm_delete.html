{% extends 'catalog/base.html' %}
{% block heading %}
<h2 class="display-4">Удаление сообщения</h2>
{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" class="row g-3" enctype="multipart/form-data">
                <div class="card shadow">
                    <p class="card-text">Вы действительно хотите удалить {{ message.title }}</p>
                    <div class="card-body p-4">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Удалить</button>
                    <a href="{% url 'blog:message_list' %}" class="btn btn-primary w-100" role="button">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
