{% extends "catalog/base.html" %}

{% block content %}
<div class="container">
    <h3 class="my-4 mr-md-auto font-weight-normal">Категории:</h3>
    <div class="list-group">
        {% for category in categories %}
            <a href="{% url 'catalog:category_products' category.id %}"
               class="list-group-item list-group-item-action">
                {{ category.name }}
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
